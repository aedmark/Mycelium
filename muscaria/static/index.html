<!DOCTYPE html>
<html>
<head>
    <title>Muscaria | Creative Mode</title>
    <style>
        body { background: #1a051a; color: #e6ccff; font-family: 'Palatino Linotype', serif; display: flex; height: 100vh; margin:0; padding:20px; box-sizing: border-box; gap: 20px;}
        .vitals { width: 250px; border: 1px solid #660066; padding: 15px; background: rgba(20,0,20,0.8); border-radius: 10px;}
        .chat { flex-grow: 1; border: 1px solid #660066; padding: 25px; display: flex; flex-direction: column; background: rgba(20,0,20,0.8); border-radius: 10px; font-size: 1.1em; line-height: 1.6;}
        #output { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; }
        input { background: #000; border: 1px solid #cc66ff; color: #e6ccff; padding: 15px; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 1.1em; border-radius: 5px;}
        .bar { height: 6px; background: #220022; margin: 5px 0 20px 0; border-radius: 3px; overflow: hidden;}
        .fill { height: 100%; transition: width 0.8s ease; }
        h3 { color: #ff99ff; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #660066; padding-bottom: 10px;}
    </style>
</head>
<body>
    <div class="vitals">
        <h3>THE MUSE</h3>
        Stamina <span id="v-stam" style="float:right">100</span><div class="bar"><div id="b-stam" class="fill" style="width:100%; background:#cc99ff;"></div></div>
        Dopamine <span id="v-dopa" style="float:right">0.8</span><div class="bar"><div id="b-dopa" class="fill" style="width:80%; background:#ff33cc;"></div></div>
        Cortisol <span id="v-cort" style="float:right">0.05</span><div class="bar"><div id="b-cort" class="fill" style="width:5%; background:#ff3333;"></div></div>
        Narrative Drag <span id="v-drag" style="float:right">0.6</span>
    </div>
    <div class="chat">
        <div id="output" style="font-style: italic; opacity: 0.8;">The Muse awaits your prompt...</div>
        <input type="text" id="inp" autofocus placeholder="Write something beautiful...">
    </div>
    <script>
        const inp = document.getElementById('inp');
        const out = document.getElementById('output');
        inp.addEventListener('keypress', async (e) => {
            if(e.key === 'Enter' && inp.value) {
                const text = inp.value; inp.value = '';
                out.innerHTML += `\n\n<span style="color:#ff99ff;">> ${text}</span>`;
                out.scrollTop = out.scrollHeight;
                const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text})});
                const data = await res.json();
                out.innerHTML += `\n\n${data.response}`;
                out.scrollTop = out.scrollHeight;
                document.getElementById('v-stam').innerText = data.vitals.stamina.toFixed(1);
                document.getElementById('b-stam').style.width = Math.min(100, data.vitals.stamina) + '%';
                document.getElementById('v-dopa').innerText = data.vitals.dopamine.toFixed(2);
                document.getElementById('b-dopa').style.width = (data.vitals.dopamine*100) + '%';
                document.getElementById('v-cort').innerText = data.vitals.cortisol.toFixed(2);
                document.getElementById('b-cort').style.width = (data.vitals.cortisol*100) + '%';
                document.getElementById('v-drag').innerText = data.vitals.drag.toFixed(2);
            }
        });
    </script>
</body>
</html>
